<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulário de contato</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container">
		<form class="formulario">
			<h1>Entre em contato</h1>
			<p class="descricao">Preencha os dados abaixo e enviaremos uma resposta.</p>

			<div class="campo">
				<label for="nome">Nome</label>
				<input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
			</div>

			<div class="campo">
				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
			</div>

			<div class="campo">
				<label for="assunto">Assunto</label>
				<select id="assunto" name="assunto" required>
					<option value="" selected disabled>Selecione uma opção</option>
					<option value="duvida">Dúvida</option>
					<option value="sugestao">Sugestão</option>
					<option value="outro">Outro</option>
				</select>
			</div>

			<div class="campo">
				<label for="mensagem">Mensagem</label>
				<textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
			</div>

			<button type="submit">Enviar mensagem</button>
		</form>
	</main>
</body>
</html>
